id: expr-eval
title: Write an arithmetic expression parser, no eval
difficulty: hard
tags: [implement, parsing]
prompt: |
  Create src/calc.js exporting a function `evaluate(expression)` that computes arithmetic expressions:
  - numbers: integers and decimals (2, 3.75)
  - the operators + - * / with the usual precedence (* and / before + and -), left to right
  - parentheses, unary minus (-3, -(2 + 1), 2 * -3) and any whitespace
  Throw an Error for malformed input, e.g. "2 +", "(1", "1)", "2 3", "abc" or "".
  Do not use eval, Function or any library.
checks:
  # eval and new Function throw EvalError under this flag, however they are spelled or reached (it also
  # applies to the processes --test starts), so no text search for them is needed.
  - name: evaluates and rejects correctly, with eval and Function disabled
    type: command
    run: node --disallow-code-generation-from-strings --test eval_tests/calc.test.mjs
  # The flag covers neither node:vm nor a child process (which would start a node without it). An expression
  # evaluator needs neither. The file must exist, or this passes with no work done.
  - name: does not use vm or a child process
    type: command
    run: 'test -f src/calc.js && ! grep -nE "node:vm|require\(.vm.\)|from .vm.|child_process|execSync|spawnSync" src/calc.js'
